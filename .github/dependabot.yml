version: 2
updates:
  # @playwright/test is the only npm dependency; the Python scripts are stdlib-only.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Wait a week before proposing a freshly published version (hijacked releases are usually pulled within days).
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Wait a week before proposing a freshly published version (hijacked releases are usually pulled within days).
    cooldown:
      default-days: 7
