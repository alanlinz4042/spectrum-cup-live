name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/data.json']
  pull_request:
    paths-ignore: ['docs/data.json']

# Read-only token: the job only builds and tests; the Pages deploy is "from branch", not an Actions step.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Build docs/index.html + docs/app.js from src and confirm they are committed
        run: |
          python3 scripts/build.py
          git diff --exit-code docs/index.html docs/app.js

      - name: Unit tests (build anchors, sync allow-list)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: '1'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
