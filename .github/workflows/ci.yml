name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/data.json']
  pull_request:
    paths-ignore: ['docs/data.json']

# Read-only token: the job only builds and tests; the Pages deploy is "from branch", not an Actions step.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build docs/index.html + docs/app.js from src and confirm they are committed
        run: |
          python3 scripts/build.py
          git diff --exit-code docs/index.html docs/app.js

      - name: Unit tests (build anchors, sync allow-list)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: '1'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
